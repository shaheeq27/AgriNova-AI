<!DOCTYPE html>
<html>
<head>
<title>AI Crop Recommender</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  height: 100vh;
  width: 100vw;
  background: #060e04;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* ── Title ── */
.title {
  text-align: center;
  position: relative;
  z-index: 10;
}

.title h1 {
  font-size: clamp(36px, 6vw, 68px);
  font-weight: 700;
  color: #e4ffe6;
  letter-spacing: -1.5px;
  line-height: 1.1;
  opacity: 0;
  transform: translateY(20px);
  animation: riseIn 1s cubic-bezier(0.16,1,0.3,1) forwards 0.4s;
  text-shadow: 0 0 20px rgba(78, 232, 106, 0.15);
}

.title h1 span {
  color: #4ee86a;
}

.title .sub {
  margin-top: 12px;
  font-size: 13px;
  font-weight: 300;
  color: #3a6e3a;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0;
  animation: riseIn 0.8s ease forwards 1.1s;
}

@keyframes riseIn {
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 600px) {
  .title h1 {
    font-size: 32px;
  }
  .bar-wrap {
    width: 100px;
  }
}

/* ── Seed particle ── */
.seed {
  position: fixed;
  bottom: -10px;
  left: var(--x);
  z-index: 5;
  opacity: 0;
  animation: flyUp var(--dur) ease-in var(--delay) infinite;
}

/* seed shape — small oval with a pointed tip like a real seed */
.seed::before {
  content: '';
  display: block;
  width: var(--w);
  height: var(--h);
  background: var(--col);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  transform: rotate(var(--rot));
  box-shadow: 0 0 4px var(--glow);
}

@keyframes flyUp {
  0%   { transform: translateY(0)      translateX(0px)   rotate(0deg);   opacity: 0;   }
  8%   { opacity: 1; }
  50%  { transform: translateY(-45vh)  translateX(var(--sway))  rotate(180deg); opacity: 0.85; }
  85%  { opacity: 0.3; }
  100% { transform: translateY(-95vh)  translateX(calc(var(--sway) * 1.4)) rotate(360deg); opacity: 0; }
}

/* ── Ground glow line ── */
.ground {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  height: 60px;
  background: linear-gradient(to top, #0d2e08aa, transparent);
  z-index: 4;
  pointer-events: none;
}

/* ── Loading bar ── */
.bar-wrap {
  margin: 30px auto 0;
  width: 140px; height: 2px;
  background: #162e14;
  border-radius: 2px;
  overflow: hidden;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards 1.8s;
}
.bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #28a040, #4ee86a);
  border-radius: 2px;
  animation: fill 4s ease forwards 2s;
}
@keyframes fill { to { width: 100%; } }

.hint {
  margin-top: 10px;
  font-size: 10px;
  color: #2a5220;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards 2s;
}
@keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<div class="ground"></div>
<div id="seeds"></div>

<div class="title">
  <h1>AI <span>Crop</span> Recommender</h1>
  <p class="sub">Powered by Machine Learning</p>
  <div class="bar-wrap"><div class="bar-fill"></div></div>
  <p class="hint" id="hint">Loading...</p>
</div>

<script>
const container = document.getElementById('seeds');

const colors = [
  { col: '#4ee86a', glow: '#4ee86a88' },
  { col: '#a8e86a', glow: '#a8e86a66' },
  { col: '#6adc50', glow: '#6adc5066' },
  { col: '#c8ff90', glow: '#c8ff9044' },
  { col: '#2db84a', glow: '#2db84a55' },
  { col: '#e8ff60', glow: '#e8ff6044' },
  { col: '#88ee44', glow: '#88ee4455' },
];

/* Create seeds spread across full width */
for (let i = 0; i < 40; i++) {
  const s = document.createElement('div');
  s.className = 'seed';

  const c = colors[Math.floor(Math.random() * colors.length)];
  const w = 4 + Math.random() * 6;   // width 4–10px
  const h = w * (1.4 + Math.random() * 0.6); // height slightly taller
  const sway = (Math.random() - 0.5) * 120;  // drift left/right

  s.style.cssText = `
    --x: ${Math.random() * 100}%;
    --dur: ${4 + Math.random() * 6}s;
    --delay: ${Math.random() * 7}s;
    --col: ${c.col};
    --glow: ${c.glow};
    --w: ${w}px;
    --h: ${h}px;
    --rot: ${Math.random() * 60 - 30}deg;
    --sway: ${sway}px;
  `;
  container.appendChild(s);
}

/* Countdown */
const hint = document.getElementById('hint');
let count = 5;
hint.textContent = `Launching in ${count}s...`;
const t = setInterval(() => {
  count--;
  hint.textContent = count > 0 ? `Launching in ${count}s...` : 'Launching...';
  if (count <= 0) clearInterval(t);
}, 1000);
setTimeout(() => {
  document.body.style.transition = "opacity 0.5s ease";
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = '/index';
  }, 500);
}, 5000);

</script>
</body>
</html>
