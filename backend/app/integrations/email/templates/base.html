<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f100e;
      color: #f2f0e8;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      background-color: #1a1b18;
      border-radius: 16px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1a1b18, #232520);
      padding: 24px 32px;
      border-bottom: 1px solid rgba(173,255,0,0.15);
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #adff00;
      font-weight: 700;
    }
    .header .subtitle {
      margin: 4px 0 0;
      font-size: 11px;
      color: #8d928c;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .content {
      padding: 32px;
    }
    .content h2 {
      margin: 0 0 16px;
      font-size: 22px;
      color: #f2f0e8;
    }
    .content p {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 1.6;
      color: #c4c8c0;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-info { background: rgba(173,255,0,0.1); color: #adff00; }
    .badge-warning { background: rgba(255,183,77,0.15); color: #ffb74d; }
    .badge-critical { background: rgba(239,83,80,0.15); color: #ef5350; }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
    }
    .data-label { color: #8d928c; }
    .data-value { color: #f2f0e8; font-weight: 500; }
    .cta {
      display: inline-block;
      margin: 24px 0 0;
      padding: 12px 28px;
      background: #adff00;
      color: #0f100e;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
    }
    .footer {
      padding: 24px 32px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
      color: #6b6f68;
      text-align: center;
    }
    .footer a { color: #8d928c; text-decoration: underline; }
  </style>
</head>
<body>
  <div style="padding: 24px; background: #0f100e;">
    <div class="wrapper">
      <div class="header">
        <h1>🌱 {{ app_name }}</h1>
        <div class="subtitle">{% block header_subtitle %}AI Agriculture{% endblock %}</div>
      </div>

      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <div class="footer">
        <p>{{ app_name }} — AI-Powered Precision Agriculture</p>
        <p>
          <a href="{{ unsubscribe_url }}">Manage notification preferences</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
