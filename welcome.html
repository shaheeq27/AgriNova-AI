<!DOCTYPE html>
<html>

<head>

<title>Welcome</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0a2a06;
color:white;
font-family:Poppins, sans-serif;
overflow:hidden;
}

/* Animation Text */

.title{
font-size:50px;
opacity:0;
animation:fadeIn 2s ease forwards;
}

/* Glow effect */

.title span{
color:#c8ffdc;
text-shadow:0 0 10px rgba(70, 255, 138, 0.8);
}

/* Animation */

@keyframes fadeIn{
0%{
opacity:0;
transform:translateY(40px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<h1 class="title">
AI <span>𝒞𝓇𝑜𝓅</span> 𝑅𝑒𝒸𝑜𝓂𝓂𝑒𝓃𝒹𝑒𝓇
</h1>

<script>

/* Redirect after 2.5 seconds */

setTimeout(function(){
window.location.href = "/index";
}, 5000);

</script>

</body>

</html>
